<script>
  // 1. Initialize Leaflet map
  const map = L.map('map', { zoomControl: false }).setView([22.3193, 114.1694], 15);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  let userMarker = null;

  // 2. Center map on user's live GPS location
  if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition((position) => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      map.setView([lat, lng], 16);

      // Blue marker representing the user
      userMarker = L.circleMarker([lat, lng], {
        color: '#1a73e8',
        fillColor: '#4285f4',
        fillOpacity: 0.9,
        radius: 8
      }).addTo(map).bindPopup("You are here");

      // Fetch nearest KMB bus data for this location
      fetchNearestStopData();
    }, () => {
      document.getElementById('eta-content').innerText = "Location access denied. Showing default stop.";
      fetchNearestStopData(); // Fallback
    });
  }

  // 3. Fetch real-time live ETAs from KMB Open API
  async function fetchNearestStopData() {
    const cardContent = document.getElementById('eta-content');
    cardContent.innerHTML = "Fetching live ETAs...";

    // Real KMB Stop ID (Example: Cross Harbour Tunnel Toll Plaza / Key HK Hub)
    const sampleStopId = "001555"; 

    try {
      const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${sampleStopId}`);
      const result = await response.json();
      
      if (!result.data || result.data.length === 0) {
        cardContent.innerHTML = "No upcoming buses found.";
        return;
      }

      // Filter out empty ETAs & sort by arrival time
      const upcoming = result.data
        .filter(item => item.eta !== null)
        .slice(0, 3); // Take top 3 buses ONLY (prevents text dump)

      // Build clean, simplified HTML list
      let html = '<ul style="list-style:none; padding:0; margin:0;">';
      upcoming.forEach(bus => {
        const minutesLeft = Math.max(0, Math.round((new Date(bus.eta) - new Date()) / 60000));
        html += `
          <li style="display:flex; justify-content:space-between; align-items:center; padding: 8px 0; border-bottom: 1px solid #eee;">
            <div>
              <strong style="font-size: 1.2em; color: #d93025;">${bus.route}</strong>
              <span style="color: #555; margin-left: 8px;">to ${bus.dest_en}</span>
            </div>
            <div style="font-weight: bold; font-size: 1.1em; color: #1e8e3e;">
              ${minutesLeft} mins
            </div>
          </li>
        `;
      });
      html += '</ul>';

      cardContent.innerHTML = html;

    } catch (error) {
      cardContent.innerHTML = "Error connecting to KMB API.";
      console.error(error);
    }
  }
</script>
