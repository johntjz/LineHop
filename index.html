<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LineHop - HK Bus Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- 1. Load Leaflet CSS and JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  
  <style>
    body { margin: 0; padding: 0; }
    /* Make the map fill the entire screen */
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    
    /* Clean, floating ETA card */
    .eta-card {
      position: absolute; bottom: 30px; left: 20px; right: 20px;
      background: white; padding: 20px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-family: sans-serif; 
      z-index: 1000; /* Must be high to sit above Leaflet's map controls */
    }
  </style>
</head>
<body>

  <!-- The container where the map will render -->
  <div id="map"></div>
  
  <!-- Your UI overlay -->
  <div class="eta-card">
    <h2 style="margin-top:0;">Nearest Stop</h2>
    <p>Loading KMB data...</p>
  </div>

  <script>
    // 2. Initialize the map centered on Hong Kong [Latitude, Longitude]
    // We disable the default zoom controls for a cleaner mobile look
    const map = L.map('map', { zoomControl: false }).setView([22.3193, 114.1694], 14);

    // 3. Add the completely free OpenStreetMap tiles
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 4. Add a simple pin marker to the map
    const marker = L.marker([22.3193, 114.1694]).addTo(map);
  </script>

</body>
</html>
